name: NOISE regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  browser-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test NOISE application logic
        run: node --test tests/noise.test.cjs
